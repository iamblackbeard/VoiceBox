<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Voice Box side panel: listen to selected text with a voice that runs on your machine." />
  <title>Voice Box</title>
  <!--
      Early theme bootstrap — runs synchronously before first paint so the
      correct theme is applied before any CSS or React renders. This prevents
      the flash of wrong theme (FOUC).
    -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme') || localStorage.getItem('listen_theme');
        var theme = (stored === 'light' || stored === 'dark')
          ? stored
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="./main.tsx"></script>
</body>

</html>
